appId: com.grudgestudio.devtool
productName: Grudge Dev Tool
copyright: Copyright © 2026 Grudge Studio
asar: true
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
# @heyputer/puter.js uses readFileSync + vm.runInNewContext on its bundled
# dist/puter.cjs and the `open` package may need to spawn platform binaries.
# Both fail under asar packing, so we unpack them.
asarUnpack:
  - "node_modules/@heyputer/puter.js/**"
  - "node_modules/open/**"
  - "node_modules/@gltf-transform/**"
extraResources:
  - from: resources
    to: .
    filter:
      - "tray.png"
      - "icon-*.png"
      - "icon.ico"
      - "brand/**"
  - from: resources/tools
    to: tools
    filter:
      - "FBX2glTF.exe"
extraMetadata:
  main: dist/main/main.js
# ---------------------------------------------------------------------------
# Elite open system — Windows "Open with" / double-click associations.
# All routes go to the Asset Viewer (openFileBridge), NEVER Forge by default.
# ---------------------------------------------------------------------------
